<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Chaos</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="card game"><div class="top"><span>⚡ QR CHAOS</span><span id="score">0 pts</span></div><div id="screen"><h1>Waiting...</h1><p>You're in. Wait for the host to start.</p></div></main>
<script>
let challenge={}, answered=false;
async function state(){try{let s=await (await fetch('/state',{cache:'no-store'})).json(),g=s.game,p=s.player;document.getElementById('score').innerText=(p?p.score:0)+' pts';if(!p){location='/';return}if(g.status==='lobby'){screen.innerHTML='<h1>🎮 You’re in!</h1><p>Waiting for the host to start...</p>';return}if(g.status==='paused'){screen.innerHTML='<h1>⏸ PAUSED</h1><p>Hang on...</p>';return}if(g.status==='finished'){screen.innerHTML='<h1>🏆 GAME OVER</h1><p>Check the leaderboard on the host screen.</p>';return}render(g.round_no)}catch(e){screen.innerHTML='<h1>Reconnecting…</h1><p>Trying the game server again.</p>'}}
async function render(n){if(answered&&window.lastRound===n)return;window.lastRound=n;answered=false;let data=JSON.parse(localStorage.getItem('challenge_'+n)||'null');if(!data){data=await (await fetch('/challenge',{cache:'no-store'})).json();localStorage.setItem('challenge_'+n,JSON.stringify(data))}challenge=data;let s=await (await fetch('/state',{cache:'no-store'})).json(),round=s.rounds[n-1];if(!round)return;let html=`<div class="badge">ROUND ${n}</div><h1>${round.name}</h1>`;if(round.kind==='reaction')html+=`<p>Wait... then hit the button as fast as possible.</p><button id="react" class="big danger">WAIT...</button>`;if(round.kind==='memory')html+=`<p>Memorize this for 4 seconds:</p><div class="memory">${data.nums.join(' • ')}</div><div id="memAnswer"></div>`;if(round.kind==='spot')html+=`<p>Which color was requested?</p><div class="colorbox ${data.target}"></div><div class="choices">${['red','blue','green','yellow'].map(x=>`<button onclick="answer('${x}',${x===data.target?200:0})">${x.toUpperCase()}</button>`).join('')}</div>`;if(round.kind==='sequence')html+=`<p>Tap these numbers in order as fast as possible:</p><div class="sequence">${data.sequence.map(x=>`<button onclick="seq(${x})">${x}</button>`).join('')}</div><p id="seqmsg"></p>`;if(round.kind==='chaos')html+=`<p>Type this backwards:</p><h2>${data.word}</h2><input id="chaos" autocomplete="off"><button onclick="checkChaos('${data.word}')">SUBMIT</button>`;if(round.kind==='final')html+=`<p>Final climb: choose your risk.</p><button onclick="answer('safe',100)">SAFE +100</button><button onclick="answer('risk',400)">RISK +400</button><button onclick="answer('insane',800)">INSANE +800</button>`;screen.innerHTML=html;if(round.kind==='reaction'){let b=document.getElementById('react');let delay=1200+Math.random()*2500;setTimeout(()=>{if(answered||window.lastRound!==n)return;b.innerText='TAP!';b.className='big good';let t=performance.now();b.onclick=()=>{if(answered)return;let ms=performance.now()-t;answer('tap',Math.max(30,Math.round(350-ms/4))) }},delay)}if(round.kind==='memory'){setTimeout(()=>{let m=document.querySelector('.memory');if(!m||answered||window.lastRound!==n)return;m.innerText='?  ?  ?  ?  ?';document.getElementById('memAnswer').innerHTML='<input id="mem" inputmode="numeric" placeholder="12345"><button onclick="answerMem()">SUBMIT</button>'},4000)}}
function answer(a,p){if(answered)return;answered=true;fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:p})});screen.innerHTML=`<h1>${p>0?'✅ NICE!':'❌ MISSED'}</h1><p>${p>0?'+'+p+' points':'0 points'}</p><p>Waiting for next round...</p>`}
function answerMem(){let a=document.getElementById('mem').value.trim();answer('',a===challenge.nums.join('')?250:0)}
function checkChaos(w){let a=document.getElementById('chaos').value.trim().toUpperCase();answer('',a===w.split('').reverse().join('')?200:0)}
let current=[],idx=0;function seq(x){if(answered)return;if(!current.length){current=challenge.sequence;idx=0}if(x===current[idx]){idx++;if(idx===current.length)answer('',300)}else{let m=document.getElementById('seqmsg');if(m)m.innerText='❌ Wrong!';answer('',0)}}
setInterval(()=>fetch('/heartbeat',{method:'POST'}),3000);setInterval(state,1000);state();
</script></body></html>
